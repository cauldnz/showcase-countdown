# Mosquitto on the GL-MT3000 for the showcase sticks.
# Install to /etc/mosquitto/mosquitto.conf. Anonymous on the LAN only: the
# router's WiFi is our own network and the sticks carry no credentials.
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /var/lib/mosquitto/
log_dest syslog
log_type error
log_type warning
log_type notice
max_queued_messages 200
